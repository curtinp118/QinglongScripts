[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["notify.py", ".tmp", "artifacts", "archives"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["notification_adapter", "runtime_control", "notify"]

[tool.ruff.format]
line-ending = "lf"
